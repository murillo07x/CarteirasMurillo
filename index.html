<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controladoria · Mapa de Carteiras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1118; --bg2:#121a24; --panel:#151f2b; --line:#233241;
  --txt:#e8eef5; --mut:#8fa3b8; --acc:#4fd1c5; --gold:#f5b63d;
  --red:#ef6461; --grn:#5ac47f; --blu:#5b9dff; --pur:#a78bfa;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: light){
 :root:not([data-theme="dark"]){
  --bg:#f3f6fa; --bg2:#ffffff; --panel:#ffffff; --line:#dde5ee;
  --txt:#14202c; --mut:#5d7186; --acc:#0f9b8e; --gold:#b97f06;
 }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
header{padding:20px 26px;border-bottom:1px solid var(--line);background:
 radial-gradient(900px 200px at 10% -40%, rgba(79,209,197,.20), transparent 70%), var(--bg2);
 display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--blu));
 display:grid;place-items:center;font-family:Sora;font-weight:700;color:#06121a;font-size:18px}
h1{font-family:Sora;font-size:19px;margin:0;letter-spacing:.2px}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:92px}
.kpi b{font-family:Sora;font-size:18px;display:block}
.kpi span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 86px)}
aside{border-right:1px solid var(--line);background:var(--bg2);padding:16px;max-height:calc(100vh - 86px);overflow:auto}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
 color:var(--txt);font-size:13.5px;outline:none}
.search:focus{border-color:var(--acc)}
.lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:16px 4px 8px}
.item{padding:10px 12px;border-radius:10px;border:1px solid transparent;cursor:pointer;font-size:13.2px;
 display:flex;gap:8px;align-items:center;line-height:1.3}
.item:hover{background:var(--panel)}
.item.on{background:linear-gradient(90deg,rgba(79,209,197,.16),transparent);border-color:var(--line);color:var(--acc);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
main{padding:22px 26px 60px;overflow-x:auto}
.empty{display:grid;place-items:center;height:60vh;text-align:center;color:var(--mut)}
.empty h2{font-family:Sora;color:var(--txt)}
.title{font-family:Sora;font-size:26px;margin:0 0 6px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.tag{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mut)}
.tag.alert{color:var(--red);border-color:rgba(239,100,97,.45);background:rgba(239,100,97,.10)}
.tag.ok{color:var(--grn);border-color:rgba(90,196,127,.4);background:rgba(90,196,127,.10)}
.mapwrap{border:1px solid var(--line);border-radius:18px;background:
 radial-gradient(700px 300px at 50% 0%, rgba(91,157,255,.10), transparent 70%),var(--bg2);padding:8px;overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:720px}
.node-card{cursor:default}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h4{font-family:Sora;font-size:13px;margin:0 0 10px;letter-spacing:.4px;text-transform:uppercase}
.card li{font-size:13px;color:var(--mut);margin:0 0 8px;line-height:1.5}
.card ul{margin:0;padding-left:16px}
.note{margin-top:20px;border-left:3px solid var(--gold);background:rgba(245,182,61,.08);padding:12px 16px;border-radius:0 12px 12px 0;font-size:13.5px}
.note b{color:var(--gold);font-family:Sora}
footer{color:var(--mut);font-size:11.5px;padding:18px 26px;border-top:1px solid var(--line)}
@media(max-width:860px){.layout{grid-template-columns:1fr}aside{max-height:none;border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
 <div class="brand">
   <div class="logo">C</div>
   <div><h1>Carteiras Murillo · Controladoria</h1>
   <div class="sub">Mapa mental operacional por cedente</div></div>
 </div>
 <div class="kpis">
   <div class="kpi"><b id="k1">0</b><span>Cedentes</span></div>
   <div class="kpi"><b id="k2">0</b><span>Observações</span></div>
   <div class="kpi"><b id="k3">0</b><span>Com alerta</span></div>
 </div>
</header>
<div class="layout">
 <aside>
  <input class="search" id="q" placeholder="Buscar cedente...">
  <div class="lbl">Selecione o cedente</div>
  <div id="list"></div>
 </aside>
 <main id="main"></main>
</div>
<footer>Fonte: Carteira_Murillo_Controladoria_Atualizada.xlsx · Classificações por tema geradas automaticamente a partir do texto das observações.</footer>
<script>
const DATA = [{"nome": "PROFISSIONAL TINTAS", "obs": "• Carteira trabalha com trans próprio e terceirizado, quando entregas são para SC ou RS, usam pequenos freteiros. Na maioria dos casos não tem rastreio.\n• Carteira é pulverizada, não apresenta problemas, pré embarque de 3-4 dias, prestar atenção nos embarques, e em pedidos sem nota.\n• Também é relativamente nova, suas primeiras operações vieram no mês de Julho. Atenção nas notificações.", "add": null}, {"nome": "ARTE & CAZZA TEXTIL", "obs": "• Carteira apresenta grande valor, a maioria dos sacados não confirmam, controlador prestar atenção nos canhotos.\n• Operações são pagas, controladoria passa para embarque prog. Até que seja enviado canhoto por e-mail, após isso passar para Ausente.\n• Apresenta um pré embarque de 15-20 dias dependendo do sacado. Transporte próprio.\n• Carteira apresenta também bastante embarques atrasados (Sem Canhoto), mas não apresenta demais problemas,", "add": "• L12: Atentar-se nos canhotos recebidos e inclusões sempre atualizadas."}, {"nome": "MULTIPLAS / LUGA / P2P", "obs": "• Carteira trabalha com tranche por amostragem, confirmados entre 60% e 70%, com nenhuma concentração acima de 150k e todos titulos acima de 50k confirmados.\n• Mercadoria em grande parte embarcada entregando em até 5d\n• Transporte próprio e de terceiros, as vezes sacados retiram no local.\n• Duplicatas, Pedidos, Cheques e parte sem nota.\n• Atenção na praça de pagamento.", "add": null}, {"nome": "ROTA GOIAS/ROSSO E DENEZ", "obs": "• Cedente é uma transportadora, opera com serviços em andamento. *CEDENTE NOVO*.\n• Foi aprovado giro de 500k\n• Validar se os CT-es estão ativos em todas operações, e se os valores e vencimentos estão corretos, atenção na checagem.\n• Carteira está apresentando grande valor de vencidos.\n• Serviços só operamos performados. 80% embarcado 20% entregue", "add": "ATENÇÃO, CEDENTE DESCONTOU TITULO EM DUPLICIDADE CONOSCO REDROBRAR ATENÇÃO. 14/09/2026"}, {"nome": "MOVEIS DORIPEL", "obs": "• 100% frete fob entrega em até 10d\n• Pré-embarque de 3 a 4 dias para os móveis DORIPEL\n• Pré-embarque de 5 a 6 dias para os móveis/ vidros sob médida da marca COMPASSO\n• Duplicata e Cheque", "add": null}, {"nome": "FRIORIO DIST DE PECAS", "obs": "• Mercadorias Eps de até 2d/embarcada\n• Transporte por terceiros\n• Carteira sem problemas, manter boa amostragem.", "add": null}, {"nome": "PIRENOPOLIS INDUSTRIA", "obs": "• 60% comissária 40% duplicatas\n• Mercadoria embarcada e entregue\n• Atentar-se cuidando se a linha CLEAN dá confirmação da operação, caso não, pedir canhoto.\n• Limite 1.1m para linha CLEAN", "add": null}, {"nome": "FABIANA PEREIRA PORTO", "obs": "• Transportadora e Agente logistico, aprovado em POC paletização, armazenagem, ajudante, reentrega e etc.\n• Confere o CNPJ do pagador, casa o número do CT-e da fatura com o DACTE\n• Verifica o status das NF's no SSW\n• Fora serviços de logistica, transportes tem que estar 100% prestado.\n• Validar se CT-e está ativo\n• Duplicata especial pagamentos na Escrow/Escrow Flex", "add": null}, {"nome": "G.R.Z DISTRIBUIDORA", "obs": "• PDD, Cedente pediu para que sacado pagasse diretamente para ele e nunca nos repassou os valores.", "add": null}, {"nome": "E C FRATUCCI / FRATUCCI EMPILHADEIRAS / C MAIA PILEGI", "obs": "• Duplicatas, Cheques, sem nota.\n• Frota própria (PR regiões próximas)\n• Terceiros para demais localidades\n• Amostragem minima de confirmaçao para operações extra tranche 60% de confirmação na carteira. Aprovado 400k de cheques de terceiros\n• Embarcado, Ct-e consta um dia depois da op, ou entregue\n• 115k Foi um Container com mercadorias que vieram trocadas, serão em recompradas em op.", "add": null}, {"nome": "DIVINUT INDUSTRIA DE NOZES", "obs": "• 50% embarcado com entrega toda terceirizada em até 7 dias 40% entregue 10% pré-embarque de até 7 dias\n• Atenção nos embarques, carteira não apresenta demais problemas\n• Sacado PLATLOG, tem alta concentração na carteira e não conseguimos confirmar", "add": null}, {"nome": "FOCUS FRANCHISING / ARKTUS / BIOSET", "obs": "• Opera com contratos já iniciados, ou seja, aceite do sacado;\n• A máquina funciona via software do cedente, então ele vende máquina, insumos, serviço e software. Qualquer inadimplência acarreta no bloqueio da máquina.\n• Mercadorias entregues, transporte de terceiros", "add": null}, {"nome": "FACE - GRAFICA E EDITORA", "obs": "• Carteira não apresenta problemas, opera com mercadorias em sua maioria entregue.\n• embarcado em até 3d\n• Transp próprio", "add": null}, {"nome": "COMMANDERS IND E COM DE CONFECCOES", "obs": "• Carteira Boa e nova\n• 80% pré-embarque de 2 dias, Algumas NF's embarcadas. 80% embarque de terceiros e 20% próprio 60% duplicata e 40% comissária e bol especial\n• Boleto especial considerar limite de duplicatas normal, comissária de liquidação na conta do cliente considerar 3x1.\n• Grupo DB3 e GIGA MAIS, não conseguimos contato de forma alguma, Concentração na carteira\n• Manter boa amostragem.", "add": "Verificar no ato da operação o que está embarcado, usando o demonstrativo que nos é enviado por e-mail."}, {"nome": "TORNADO OPERADOR LOGISTICO", "obs": "• Cedente é novo, opera com serviços 100% prestados.\n• 65% Duplicata 35% Comissária\n• Validar se Dactes em tela estão ativos, e se as notas das faturas estão corretas conforme AP em tela\n• Principal sacado é a BALY", "add": null}, {"nome": "SKYLINE INDUSTRIA", "obs": "• Transporte 100% de terceiros, mercadoria entregue ou embarcada\n• Carteira não apresenta problemas, apenas atenção no pré-faturamento que as vezes acontece", "add": null}, {"nome": "OLINDA IMPORTACAO E COMERCIO", "obs": "• Carteira opera com pré faturamento e embarcada, onde cedente sinaliza antes da operação e tem cumprido prazos, opera com transporte próprio.\n• Principal sacado é a NOVAFLEX.", "add": null}, {"nome": "CAMA INBOX INDUSTRIA", "obs": "• Carteira só opera altas concentrações, apresenta um indicio de Intercompany, atenção nas confirmações.\n• Franquiados - Duplicata\n• Ficou definido que cedente é saída de risco. Vamos operar 50% do que liquidar\n• Mercadoria entregue ou embarcada com transporte próprio.", "add": null}, {"nome": "BELLESA COMERCIAL LTDA", "obs": "• Carteira já apresento um número absurdo de divergência de praça. Atentar-se.\n• Pré-Embarque de 3-5 Dias, Majoritariamente entrega por terceiros, alguns títulos específicos próximos são de entrega própria.\n• Cedente não costuma ter atrasos na entrega.", "add": "Saida de risco."}, {"nome": "VILA NOVA AGROINDUSTRIAL LTDA", "obs": "• Mercadoria embarcada e entregue por transporte próprio e de terceiros.\n• Cedente relativamente novo.", "add": null}, {"nome": "RP PROMO INDUSTRIA", "obs": "• Paramos de operar com cedente pois adquiriu varios restritivos\n• Porto Alegre e Região transporte próprio\n• Demais localidades do país: envio via transportadoras ou Correios\n• pré-embarque de 10 a 15 dias.", "add": null}, {"nome": "POQUEMA INDUSTRIA E COMERCIO", "obs": "• Cedente novo, em sua primeira operação já houve atraso\n• Pré de 15-20 dias\n• Transporte terceirizado\n• 90% duplicata e 10% comissaria", "add": null}, {"nome": "MINASLASER LTDA", "obs": "• Em sua primeira operação com o sacado VALE, foi dada operação não realizada, cedente informou que é normal e que iram efetuar os pagamentos normalmente\n• embarcado, sendo 95% FRETE FOB com embarque em até 3 dias e 5% embarcado por terceiros 35% COMISSÁRIA e 65% DUPLICATA", "add": null}, {"nome": "GRUPO FALGE/METALNORTE", "obs": "• Empresa não opera mais.", "add": null}, {"nome": "ECOBOXES EMBALAGENS PLASTICAS", "obs": "• Duplicatas e comissária\n• Mercadoria majoritariamente entregue\n• Transporte terceirizado", "add": null}, {"nome": "CALDAS SEG INDUSTRIA", "obs": "• 50% embarcado e 50% pré-embarque de até 5 dias 100% duplicata\n• Atrasa os prazos.\n• 70% entrega própria e restante terceiro.", "add": null}, {"nome": "BVTEX INDUSTRIA TEXTIL", "obs": "• 90% com nota e 10% sem nota;\n• Transporte de terceiros: transportadoras e pequenos freteiros;\n• Opera 50% embarcada e 50% entregue.", "add": null}];
const THEMES = [
 {key:'transporte', label:'Transporte & Logística', color:'var(--blu)', re:/transport|frete|freteir|entrega|embarc|transportadora|correios|frota|rastre|retir|ct-?e|dacte|ssw/i},
 {key:'prazo', label:'Prazos & Pré-embarque', color:'var(--acc)', re:/pré[- ]?embarque|pre[- ]?embarque|prazo|dias|d\b|pré[- ]?fatur|atras/i},
 {key:'titulos', label:'Títulos & Modalidade', color:'var(--pur)', re:/duplicat|cheque|comiss[áa]ri|sem nota|nota|fatura|escrow|tranche|giro|limite|concentra|pdd/i},
 {key:'risco', label:'Riscos & Atenção', color:'var(--red)', re:/aten[çc]|risco|problema|divergên|restritiv|não opera|paramos|duplicidade|vencid|não confirm|indicio|indício|canhoto|checagem|valida/i},
 {key:'geral', label:'Geral', color:'var(--gold)', re:/.^/}
];
const ALERT = /aten[çc]|risco|problema|divergên|restritiv|paramos|duplicidade|vencid|pdd|não opera|atras/i;

function splitObs(t){ if(!t) return [];
 return t.split(/\n|(?:^|\s)•\s*/).map(s=>s.replace(/^[•\-\s]+/,'').trim()).filter(s=>s.length>2);}
function classify(s){ for(const th of THEMES){ if(th.re.test(s)) return th.key;} return 'geral';}

const items = DATA.map(d=>{
  const obs = splitObs(d.obs);
  const groups = {};
  obs.forEach(o=>{const k=classify(o);(groups[k]=groups[k]||[]).push(o);});
  const alert = obs.some(o=>ALERT.test(o)) || !!d.add;
  return {...d, obs, groups, alert};
});
document.getElementById('k1').textContent = items.length;
document.getElementById('k2').textContent = items.reduce((a,b)=>a+b.obs.length,0);
document.getElementById('k3').textContent = items.filter(i=>i.alert).length;

const list=document.getElementById('list'), main=document.getElementById('main');
let sel=null;
function renderList(f=''){
 list.innerHTML='';
 items.filter(i=>i.nome.toLowerCase().includes(f.toLowerCase())).forEach(i=>{
  const el=document.createElement('div');
  el.className='item'+(sel===i.nome?' on':'');
  el.innerHTML='<span class="dot" style="background:'+(i.alert?'var(--red)':'var(--grn)')+'"></span><span>'+i.nome+'</span>';
  el.onclick=()=>{sel=i.nome;renderList(document.getElementById('q').value);render(i);window.scrollTo({top:0,behavior:'smooth'});};
  list.appendChild(el);
 });
}
document.getElementById('q').oninput=e=>renderList(e.target.value);

function wrap(text,max){const w=text.split(' ');const out=[];let l='';
 w.forEach(x=>{if((l+' '+x).trim().length>max){out.push(l.trim());l=x;}else l+=' '+x;});
 if(l.trim())out.push(l.trim());return out;}

function render(i){
 const used = THEMES.filter(t=>i.groups[t.key]&&i.groups[t.key].length);
 // layout: center left-ish, branches stacked right/left alternating
 const CW=1100, pad=30;
 const colW=340, cx=CW/2, gapY=26;
 const left=[],right=[];
 used.forEach((t,idx)=> (idx%2?left:right).push(t));
 function colHeight(col){return col.reduce((a,t)=>a+ boxH(t,i)+gapY,0);}
 function boxH(t,i){const lines=i.groups[t.key].reduce((a,o)=>a+wrap(o,44).length,0);
   return 34 + lines*17 + i.groups[t.key].length*8;}
 const H=Math.max(colHeight(left),colHeight(right),260)+80;
 let s='<svg viewBox="0 0 '+CW+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">';
 const cy=H/2;
 function drawCol(col,dir){
   let y=cy-colHeight(col)/2;
   col.forEach(t=>{
     const h=boxH(t,i), bx = dir>0? cx+95 : cx-95-colW, by=y;
     const my=by+h/2;
     const x1= dir>0? cx+70: cx-70;
     s+='<path d="M '+x1+' '+cy+' C '+(x1+dir*50)+' '+cy+', '+(bx-dir*40+(dir>0?0:colW))+' '+my+', '+(dir>0?bx:bx+colW)+' '+my+'" fill="none" stroke="'+t.color+'" stroke-width="2" opacity=".55"/>';
     s+='<rect x="'+bx+'" y="'+by+'" width="'+colW+'" height="'+h+'" rx="14" fill="var(--panel)" stroke="'+t.color+'" stroke-opacity=".55"/>';
     s+='<rect x="'+bx+'" y="'+by+'" width="4" height="'+h+'" rx="2" fill="'+t.color+'"/>';
     s+='<text x="'+(bx+16)+'" y="'+(by+22)+'" fill="'+t.color+'" font-size="12" font-weight="700" letter-spacing=".6" font-family="Sora, sans-serif">'+t.label.toUpperCase()+'</text>';
     let ty=by+42;
     i.groups[t.key].forEach(o=>{
       const ls=wrap(o,44);
       s+='<circle cx="'+(bx+20)+'" cy="'+(ty-4)+'" r="2.6" fill="'+t.color+'"/>';
       ls.forEach((ln,k)=>{ s+='<text x="'+(bx+30)+'" y="'+ty+'" fill="var(--txt)" font-size="12.2" opacity=".92">'+esc(ln)+'</text>'; ty+=17;});
       ty+=8;
     });
     y+=h+gapY;
   });
 }
 drawCol(right,1); drawCol(left,-1);
 const nm=wrap(i.nome,18);
 s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="92" ry="'+(38+nm.length*7)+'" fill="var(--bg2)" stroke="var(--acc)" stroke-width="2"/>';
 nm.forEach((ln,k)=> s+='<text x="'+cx+'" y="'+(cy-((nm.length-1)*8)+k*16+5)+'" text-anchor="middle" fill="var(--acc)" font-size="13" font-weight="700" font-family="Sora, sans-serif">'+esc(ln)+'</text>');
 s+='</svg>';

 let cards='<div class="cards">'+used.map(t=>'<div class="card"><h4 style="color:'+t.color+'">'+t.label+'</h4><ul>'+i.groups[t.key].map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul></div>').join('')+'</div>';
 let note = i.add? '<div class="note"><b>Informação adicional:</b> '+esc(i.add)+'</div>':'';
 main.innerHTML='<h2 class="title">'+esc(i.nome)+'</h2>'+
  '<div class="tags"><span class="tag '+(i.alert?'alert':'ok')+'">'+(i.alert?'Requer atenção':'Sem apontamentos críticos')+'</span>'+
  '<span class="tag">'+i.obs.length+' observações</span>'+used.map(t=>'<span class="tag" style="color:'+t.color+'">'+t.label+'</span>').join('')+'</div>'+
  note+'<div class="mapwrap">'+s+'</div>'+cards;
}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
main.innerHTML='<div class="empty"><div><h2>Selecione um cedente</h2><p>Escolha uma carteira na lista ao lado para visualizar o mapa mental das observações operacionais.</p></div></div>';
renderList();
</script>
</body></html>
